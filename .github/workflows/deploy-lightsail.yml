# Deploy to AWS Lightsail.
#
# Triggered ONLY after the `CI` workflow completes successfully on `main`.
# This is enforced by the `workflow_run` event below — no commit can reach
# the server without first passing CI (lint, typecheck, test, docker-build).
#
# Required GitHub secrets:
#   LIGHTSAIL_SSH_KEY     — private SSH key for the Lightsail instance
#   LIGHTSAIL_HOST        — public IP or hostname of the instance
#   LIGHTSAIL_USER        — SSH user (e.g. ubuntu)
#   LIGHTSAIL_APP_PATH    — absolute path to the repo on the instance (e.g. /home/ubuntu/bring_importer)
#   OPENAI_API_KEY        — passed into the container via .env
#   SECRET_KEY            — JWT signing secret; passed into the container via .env
#   ORIGIN_CERT / ORIGIN_KEY — optional Cloudflare Origin CA certificate + key (PEM)
#                           for nginx; enables Cloudflare SSL mode "Full (strict)"
#   GOOGLE_CLIENT_ID      — Google OAuth client id (Calendar sync); via .env
#   GOOGLE_CLIENT_SECRET  — Google OAuth client secret (Calendar sync); via .env

name: Deploy to AWS Lightsail

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    # Only deploy if the upstream CI run succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

      - name: Add Lightsail host to known_hosts
        run: ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure Docker is installed on Lightsail
        run: |
          ssh ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} '
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found — installing via get.docker.com..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker $USER
              echo "Docker installed: $(docker --version)"
            else
              echo "Docker already present: $(docker --version)"
            fi
          '

      - name: Pull latest code
        run: |
          ssh ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} '
            sudo chown -R $USER:$USER ${{ secrets.LIGHTSAIL_APP_PATH }}
            cd ${{ secrets.LIGHTSAIL_APP_PATH }}
            git fetch origin
            git reset --hard origin/main
          '

      - name: Write .env from secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          {
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            echo "SECRET_KEY=${SECRET_KEY}"
            echo "APP_VERSION=$(git rev-parse --short HEAD)"
            echo "NGINX_PORT=80"
            echo "NGINX_SSL_PORT=443"
            echo "BACKEND_PORT=8001"
            echo "COMPOSE_PROJECT_NAME=bring_importer"
            echo "API_URL=/api"
            echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
            echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}"
            echo "GOOGLE_REDIRECT_URI=https://bring.vimi.run/api/integrations/google/callback"
          } | ssh ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
              "cat > ${{ secrets.LIGHTSAIL_APP_PATH }}/.env"

      - name: Ensure Node.js is installed on Lightsail
        run: |
          ssh ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} '
            if ! command -v node >/dev/null 2>&1; then
              echo "Node.js not found — installing via NodeSource..."
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
              echo "Node installed: $(node --version), npm: $(npm --version)"
            else
              echo "Node already present: $(node --version), npm: $(npm --version)"
            fi
          '

      - name: Build frontend
        run: |
          ssh ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
            'cd ${{ secrets.LIGHTSAIL_APP_PATH }}/frontend-react && npm ci && npm run build'

      - name: Deploy with docker compose
        run: |
          ssh ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
            'cd ${{ secrets.LIGHTSAIL_APP_PATH }} && sudo docker compose -f docker-compose.yml build --pull && sudo docker compose -f docker-compose.yml down && sudo docker compose -f docker-compose.yml up -d'

      # The Cloudflare Origin CA certificate (secrets ORIGIN_CERT / ORIGIN_KEY) lets
      # Cloudflare verify this server in SSL mode "Full (strict)". It replaces the
      # self-signed certificate in the nginx-certs volume; nginx -t guards the swap
      # and the previous certificate is restored if nginx rejects the new one.
      - name: Install Cloudflare origin certificate
        env:
          ORIGIN_CERT: ${{ secrets.ORIGIN_CERT }}
          ORIGIN_KEY: ${{ secrets.ORIGIN_KEY }}
          SSH_TARGET: ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}
          APP_PATH: ${{ secrets.LIGHTSAIL_APP_PATH }}
        run: |
          if [ -z "$ORIGIN_CERT" ] || [ -z "$ORIGIN_KEY" ]; then
            echo "No origin certificate secrets set; keeping the existing certificate."
            exit 0
          fi
          put() {
            printf '%s\n' "$2" | ssh "$SSH_TARGET" \
              "cd '$APP_PATH' && sudo docker compose -f docker-compose.yml exec -T nginx sh -c 'umask 077 && cat > /etc/nginx/certs/$1.new'"
          }
          put server.crt "$ORIGIN_CERT"
          put server.key "$ORIGIN_KEY"
          ssh "$SSH_TARGET" "cd '$APP_PATH' && sudo docker compose -f docker-compose.yml exec -T nginx sh -s" <<'EOF'
          set -e
          cd /etc/nginx/certs
          for f in server.crt server.key; do
            if [ -f "$f" ]; then cp "$f" "$f.bak"; fi
            mv "$f.new" "$f"
          done
          chmod 644 server.crt
          chmod 600 server.key
          if nginx -t; then
            nginx -s reload
            echo "Origin certificate installed."
          else
            for f in server.crt server.key; do
              if [ -f "$f.bak" ]; then mv "$f.bak" "$f"; fi
            done
            nginx -s reload
            echo "nginx rejected the new certificate; restored the previous one." >&2
            exit 1
          fi
          EOF

      - name: Print deployment success
        run: echo "Deployment to AWS Lightsail completed."
